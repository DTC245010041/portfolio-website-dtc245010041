services:
  app:
    build: .
    container_name: portfolio_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      DB_HOST: mysql
      DB_NAME: portfolio
      DB_USER: portfolio_user
      DB_PASS: ${DB_PASS}
    volumes:
      - ./app:/var/www/html:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - portfolio_net

  mysql:
    image: mysql:8.4
    container_name: portfolio_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - portfolio_db:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - portfolio_net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: portfolio_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - portfolio_net

  nginx:
    image: nginx:alpine
    container_name: nginx_demo
    restart: unless-stopped
    ports:
      - "192.168.79.128:8080:80"
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portfolio_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "192.168.79.128:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  portfolio_net:
    external: true
    name: portfolio_portfolio_net
  monitoring:
    external: true
    name: bai-thuc-hanh-prometheus_monitoring

volumes:
  portfolio_db:
    external: true
    name: portfolio_portfolio_db
  prometheus_data:
    external: true
    name: bai-thuc-hanh-prometheus_prometheus_data
  grafana_data:
    external: true
    name: bai-thuc-hanh-prometheus_grafana_data
  loki_data:
    external: true
    name: bai-thuc-hanh-prometheus_loki_data
